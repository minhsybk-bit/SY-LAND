services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - creator_redis:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.creator-api
    restart: unless-stopped
    env_file: .env.creator
    command: ["python3", "-m", "uvicorn", "creator_api.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    ports:
      - "8000:8000"
    volumes:
      - creator_media:/data/creator
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile.creator
    restart: unless-stopped
    env_file: .env.creator
    command: ["python3", "-m", "celery", "-A", "creator_api.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=1"]
    volumes:
      - creator_media:/data/creator
    depends_on:
      - redis
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.creator-api
    restart: unless-stopped
    env_file: .env.creator
    command: ["python", "-m", "celery", "-A", "creator_api.celery_app:celery_app", "beat", "--loglevel=INFO"]
    volumes:
      - creator_media:/data/creator
    depends_on:
      - redis

volumes:
  creator_media:
  creator_redis:
